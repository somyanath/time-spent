appId: com.somyanath.timetracker
productName: Time Tracker

directories:
  output: release
  buildResources: build

# Bundle the built processes and the tray icon; point Electron at the built main.
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources
    to: resources
extraMetadata:
  main: out/main/index.js

mac:
  category: public.app-category.productivity
  target:
    - dir
  # Menu-bar agent: no Dock icon, no app-switcher entry. This is the real
  # LSUIElement grant (app.dock.hide() covers the same behaviour in `pnpm dev`).
  extendInfo:
    LSUIElement: true
  # Personal use: no notarization required. `identity` is deliberately left
  # unset (not `null`) so electron-builder auto-discovers a locally-installed
  # Apple ID "Personal Team" certificate — free, created once via Xcode ▸
  # Settings ▸ Accounts ▸ Manage Certificates ▸ "+" ▸ Apple Development — and
  # signs with it. That gives the app a single stable identity across
  # rebuilds, so TCC grants (Screen Recording, etc.) survive a rebuild
  # instead of re-prompting every time. With no certificate installed (e.g.
  # in CI, or on a platform other than macOS) electron-builder logs a warning
  # and falls back to an unsigned build rather than failing.
  gatekeeperAssess: false
